[package]
name = "rogue-machines"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Fault injection for chaos engineering - armed experiments that make a dependency fail, stall or lie, no_std with zero dependencies"
repository = "https://github.com/seuros/rogue_machines"
keywords = ["fault-injection", "chaos-engineering", "resilience", "testing", "no-std"]
categories = ["no-std", "development-tools::testing"]
readme = "README.md"
exclude = ["src/**/tests.rs", "tests/"]
[lib]
name = "rogue_machines"
crate-type = ["lib"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[lints]
workspace = true
